name: 카드뉴스 인스타 발행

on:
  schedule:
    # 일본 12:30 = UTC 03:30. 깃허브 정기 실행은 정각·30분에 몰려 몇 시간씩 밀리므로
    # 어중간한 분으로 여러 번 건다. done.json / threads_done.json 이 중복 발행을 막는다
    - cron: "17 3 * * *"
    - cron: "41 3 * * *"
    - cron: "13 4 * * *"
    - cron: "47 4 * * *"
  workflow_dispatch:        # 손으로도 돌릴 수 있게

permissions:
  contents: write           # done.json 을 저장소에 다시 쓴다

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 발행
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: python3 publish.py

      - name: 기록 저장
        if: always()
        run: |
          touch threads_done.json
          if [ -n "$(git status --porcelain done.json threads_done.json)" ]; then
            git config user.name  "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add done.json threads_done.json
            git commit -m "발행 기록"
            git push
          fi
